packages:
  - packages/*
  - apps/*

# Tout reste dans le dossier du projet (aucun cache global).
storeDir: .pnpm-store
cacheDir: .tmp/pnpm-cache

allowBuilds:
  argon2: true
  better-sqlite3: true
  esbuild: true
  electron: true
  # Installeur Squirrel non utilisé (NSIS) : script d'installation refusé.
  electron-winstaller: false
