# Rôle en lecture seule pour CloudMap, à déployer dans tous les comptes d'une organisation
# par un StackSet (modèle de permissions « service-managed », depuis le compte de gestion ou un
# administrateur délégué CloudFormation). Le compte « hub » (profil qui porte les identifiants dans
# CloudMap) assume ce rôle dans chaque compte membre, avec l'External ID choisi.
#
#   aws cloudformation create-stack-set \
#     --stack-set-name cloudmap-lecture-seule \
#     --template-body file://stackset-lecture-seule.yaml \
#     --permission-model SERVICE_MANAGED \
#     --auto-deployment Enabled=true,RetainStacksOnAccountRemoval=false \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameters ParameterKey=TrustedAccountId,ParameterValue=<ACCOUNT_ID_HUB> \
#                  ParameterKey=ExternalId,ParameterValue=<EXTERNAL_ID>
#   aws cloudformation create-stack-instances \
#     --stack-set-name cloudmap-lecture-seule \
#     --deployment-targets OrganizationalUnitIds=<ID_RACINE_OU_OU> \
#     --regions us-east-1
#
# Un StackSet « service-managed » ne se déploie pas dans le compte de gestion lui-même : ce compte
# est couvert par le profil hub (ou par une pile créée à la main avec le même modèle).
AWSTemplateFormatVersion: '2010-09-09'
Description: Rôle en lecture seule pour CloudMap (aucune lecture de valeur secrète)

Parameters:
  TrustedAccountId:
    Type: String
    AllowedPattern: '\d{12}'
    Description: Compte du profil hub autorisé à assumer le rôle
  ExternalId:
    Type: String
    MinLength: 16
    NoEcho: true
    Description: External ID affiché par CloudMap (page « Comptes de l'organisation »)
  RoleName:
    Type: String
    Default: CloudMapLectureSeule

Resources:
  RoleLectureSeule:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Lecture seule pour CloudMap
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess'
      Policies:
        - PolicyName: JamaisDeValeursSecretes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:BatchGetSecretValue
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:GetParameterHistory
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: '*'

Outputs:
  RoleArn:
    Value: !GetAtt RoleLectureSeule.Arn
