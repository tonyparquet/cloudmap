# Configuration dynamique Traefik (fournisseur « file ») : TLS 1.3 côté client, rechiffrement HTTPS
# vers l'application (certificat de l'application vérifié), redirection HTTP → HTTPS.
tls:
  options:
    modern:
      minVersion: VersionTLS13
      sniStrict: true

http:
  serversTransports:
    carto-transport:
      # Nom présent dans le certificat de l'application et autorité qui l'a signé.
      serverName: carto.internal
      rootCAs:
        - /etc/traefik/certs/carto-ca.pem

  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

  routers:
    redirect-http:
      entryPoints:
        - web
      rule: HostRegexp(`.+`)
      middlewares:
        - redirect-https
      service: noop@internal
