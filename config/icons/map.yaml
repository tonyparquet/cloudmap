# Correspondance nom d'icône (champ `icon` des règles) → icône du pack officiel de chaque fournisseur.
# Utilisé par `pnpm fetch-icons`, qui copie les SVG trouvés dans config/icons/<fournisseur>/<nom>.svg.
# Sans le pack, les icônes génériques de config/icons/generic/ (par catégorie) servent de repli.
#
# - aws   : valeur = nom exact du fichier dans le pack « AWS Architecture Icons ».
# - azure : valeur = suffixe de service du pack « Azure Public Service Icons »
#           (fichiers `NNNNN-icon-service-<Suffixe>.svg` ; le préfixe numérique est ignoré).
# - gcp   : valeur = nom de base du pack « Google Cloud legacy icons » (`<nom>.svg`).

