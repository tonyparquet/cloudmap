# Google Cloud — types sans règle dédiée : nœud générique avec l'icône de sa catégorie, par API.
# Le joker le plus long l'emporte ; une règle dédiée (autre fichier gcp-*.yaml) prime toujours.
- type: compute.googleapis.com/*
  typeLabel: Ressource Compute Engine
  label: &nom "$r.raw.displayName ? $r.raw.displayName : ($r.raw.name ? $split($r.raw.name, '/')[-1] : $split($r.id, '/')[-1])"
  icon: gcp-compute-engine
  category: compute
  console: &console "'https://console.cloud.google.com/home/dashboard?project=' & ($r.account ? $r.account : $all.meta.accountId)"

- type: container.googleapis.com/*
  typeLabel: Ressource GKE
  label: *nom
  icon: gcp-gke
  category: compute
  console: *console

