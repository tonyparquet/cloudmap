# Ressources sans règle dédiée (inventaire AWS Config ou Resource Explorer) : nœud générique
# avec l'icône de sa catégorie. Le joker le plus long l'emporte ; `AWS::*` est le repli final.
- type: AWS::*
  label: &nom '$r.tags.Name ? $r.tags.Name : ($r.raw.resourceName ? $r.raw.resourceName : ($r.raw.Name ? $r.raw.Name : $r.id))'
  icon: generic
  category: generic

