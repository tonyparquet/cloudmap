# Métadonnées uniquement : la valeur d'un secret n'est jamais lue.
- type: AWS::SecretsManager::Secret
  typeLabel: Secret
  label: '$r.tags.Name ? $r.tags.Name : ($r.raw.Name ? $r.raw.Name : $r.id)'
  sublabel: "$r.raw._status = 'inconnu' ? 'métadonnées inaccessibles' : ($r.raw.LastAccessedDate ? 'utilisé le ' & $substring($r.raw.LastAccessedDate, 0, 10) : ($r.raw.RotationEnabled ? 'rotation active' : 'métadonnées'))"
  icon: secrets-manager
  category: security
  awsService: secretsmanager
  status: [{ default: actif }]
  relations:
    - { kind: data, to: '$r.raw.KmsKeyId', resolve: arn, label: KMS }
