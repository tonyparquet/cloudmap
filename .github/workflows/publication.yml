# Publication d'une version : un tag vX.Y.Z (créé par `pnpm release X.Y.Z`) déclenche la vérification
# complète, la construction de l'application de bureau sur Windows (NSIS + ZIP) et macOS Apple Silicon
# (DMG + ZIP), puis la release GitHub avec les notes de CHANGELOG.md. Signature facultative : sans
# secrets, artefacts non signés (voir docs/bureau.md). Lancement manuel possible (sans release).
# Recommandation : épingler les actions sur une empreinte de commit après revue.
name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  construire:
    needs: verifier
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cible: --win
          - os: macos-latest
            cible: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:dist ${{ matrix.cible }} --publish never
        env:
          # Windows : certificat Authenticode (.pfx en base64). macOS : certificat « Developer ID
          # Application » (.p12 en base64) et notarisation Apple.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmap-${{ runner.os }}
          path: |
            apps/desktop/dist/release/*.exe
            apps/desktop/dist/release/*.dmg
            apps/desktop/dist/release/*.zip
          if-no-files-found: error

  publier:
    needs: construire
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - run: node_modules/.bin/tsx scripts/release.ts notes "${GITHUB_REF_NAME#v}" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "CloudMap ${GITHUB_REF_NAME#v}" --notes-file notes.md artefacts/*/*
        env:
          GH_TOKEN: ${{ github.token }}
