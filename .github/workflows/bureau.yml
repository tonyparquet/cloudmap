# Application de bureau : installeur Windows (NSIS + ZIP) et macOS Apple Silicon (DMG + ZIP), construits
# chacun sur sa plateforme. Signature facultative : sans secrets, les artefacts sont produits non signés
# (avertissement SmartScreen / Gatekeeper au premier lancement, voir docs/bureau.md).
# Recommandation : épingler les actions sur une empreinte de commit après revue.
name: Application de bureau

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cible: --win
          - os: macos-latest
            cible: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm desktop:dist ${{ matrix.cible }}
        env:
          # Windows : certificat Authenticode (.pfx en base64). macOS : certificat « Developer ID
          # Application » (.p12 en base64) et notarisation Apple.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: cartographe-aws-${{ runner.os }}
          path: |
            apps/desktop/dist/release/*.exe
            apps/desktop/dist/release/*.dmg
            apps/desktop/dist/release/*.zip
          if-no-files-found: error
